name: android release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re-)attach the APK to"
        required: true

jobs:
  build-and-attach:
    name: Build and attach APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build PWA bundle (embedded by android-shell's Gradle copyWebapp task)
        run: |
          npm run build --workspace @dronelink/core-transport
          npm run build --workspace @dronelink/air-client-sdk
          npm run build --workspace @dronelink/ui-kit-shared
          npm run build --workspace @dronelink/air-webapp

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        working-directory: android-shell
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p release-out
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk \
            "release-out/dronelink-android-${RELEASE_TAG}.apk"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "release-out/dronelink-android-${RELEASE_TAG}.apk" \
            --clobber
