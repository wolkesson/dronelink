name: webapp CI

on:
  push:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/webapp-ci.yml"

jobs:
  build-lint-test:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp

    # TODO (future — headless regression harness): add a service container or step here that
    # runs a Node-based harness using werift + a mock/SITL transport to exercise the
    # /core relay logic without a real browser. This is optional and deferred past Phase 1.
    #
    # TODO (SITL integration): if /webapp gains protocol-contract tests against /protocol/fixtures,
    # wire the INAV SITL service container here the same way as ground-ci.yml.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
        continue-on-error: true  # lint is advisory until ESLint config is finalized

      - name: Test
        run: npm test
