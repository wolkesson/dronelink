name: webapp CI

on:
  push:
  pull_request:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - "apps/air-webapp/**"
              - "packages/core-transport/**"
              - "packages/air-client-sdk/**"
              - "packages/ui-kit-shared/**"
              - "protocol/**"
              - ".github/workflows/webapp-ci.yml"

  build-lint-test:
    name: Build, lint, and test (webapp)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    # TODO (future — headless regression harness): add a service container or step here that
    # runs a Node-based harness using werift + a mock/SITL transport to exercise the
    # shared relay logic without a real browser. This is optional and deferred past Phase 1.
    #
    # TODO (SITL integration): if air-side packages gain protocol-contract tests against
    # /protocol/fixtures, wire the INAV SITL service container here the same way as ground-ci.yml.

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: |
          npm run build --workspace @dronelink/core-transport
          npm run build --workspace @dronelink/air-client-sdk
          npm run build --workspace @dronelink/ui-kit-shared
          npm run build --workspace @dronelink/air-webapp

      - name: Lint
        run: |
          npm run lint --workspace @dronelink/core-transport
          npm run lint --workspace @dronelink/air-client-sdk
          npm run lint --workspace @dronelink/ui-kit-shared
          npm run lint --workspace @dronelink/air-webapp

      - name: Test
        run: |
          npm test --workspace @dronelink/core-transport
          npm test --workspace @dronelink/air-client-sdk
          npm test --workspace @dronelink/ui-kit-shared
