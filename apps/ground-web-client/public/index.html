<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DroneLink Ground Video</title>
    <style>
      /* A bounded display box showing the whole received frame (object-fit:
         contain) -- an unconstrained <video> just renders at its own intrinsic
         size. "Zoom to fill" is applied air-side, in the frames themselves. */
      #live-video {
        display: block;
        width: 100%;
        max-width: 960px;
        height: 60vh;
        max-height: 540px;
        background: #000;
        object-fit: contain;
      }
      #pairing-qr {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        width: 100%;
        max-width: 960px;
        height: 60vh;
        max-height: 540px;
        background: #fff;
        color: #000;
      }
      #pairing-qr-code svg {
        width: min(60vw, 360px);
        height: min(60vw, 360px);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DroneLink live video</h1>
      <p id="status" role="status">Connecting to the ground video relay…</p>
      <p id="video-latency" role="status">Video latency (jitter buffer): —</p>
      <p id="air-data-latency" role="status">Data latency (round trip): —</p>
      <p id="air-battery" role="status" data-level="unknown">Air unit battery: unknown</p>
      <p id="air-data-usage" role="status">Air unit data: unknown</p>
      <video id="live-video" autoplay playsinline controls></video>
      <div id="pairing-qr">
        <p>Scan with the air unit to connect</p>
        <div id="pairing-qr-code"></div>
      </div>
      <p>
        <label for="quality-select">Video quality</label>
        <select id="quality-select">
          <option value="auto" selected>Auto</option>
          <option value="high">High</option>
          <option value="low">Low</option>
          <option value="data-only">Data-only (no video)</option>
        </select>
      </p>
      <p>
        <label for="camera-select">Camera source</label>
        <select id="camera-select" disabled>
          <option value="">No cameras reported yet</option>
        </select>
        <button type="button" id="camera-set-default" disabled>Set as default</button>
      </p>
      <p>
        <label><input type="checkbox" id="flip-horizontal" /> Flip horizontal</label>
        <label><input type="checkbox" id="flip-vertical" /> Flip vertical</label>
        <label><input type="checkbox" id="zoom-fill" /> Zoom to fill (crops a 90°/270° rotation instead of pillarboxing)</label>
      </p>
      <p>
        Rotation: <span id="rotation-label">0°</span>
        <button type="button" id="rotate-left">⟲ Rotate left</button>
        <button type="button" id="rotate-right">⟳ Rotate right</button>
      </p>
    </main>
    <script type="module" src="/gui-client.js"></script>
  </body>
</html>
