<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DroneLink Ground Video</title>
    <style>
      /* Bounded so "zoom to fit" vs "zoom to fill" (object-fit: contain vs cover)
         actually has a box to fit/fill within -- an unconstrained <video> just
         renders at its own intrinsic size and object-fit has nothing to do. */
      #live-video {
        display: block;
        width: 100%;
        max-width: 960px;
        height: 60vh;
        max-height: 540px;
        background: #000;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DroneLink live video</h1>
      <p id="status" role="status">Connecting to the ground video relay…</p>
      <p id="air-battery" role="status" data-level="unknown">Air unit battery: unknown</p>
      <p id="air-data-usage" role="status">Air unit data: unknown</p>
      <video id="live-video" autoplay playsinline controls></video>
      <p>
        <label for="quality-select">Video quality</label>
        <select id="quality-select">
          <option value="auto" selected>Auto</option>
          <option value="high">High</option>
          <option value="low">Low</option>
          <option value="data-only">Data-only (no video)</option>
        </select>
      </p>
      <p>
        <label for="camera-select">Camera source</label>
        <select id="camera-select" disabled>
          <option value="">No cameras reported yet</option>
        </select>
        <button type="button" id="camera-set-default" disabled>Set as default</button>
      </p>
      <p>
        <label><input type="checkbox" id="flip-horizontal" /> Flip horizontal</label>
        <label><input type="checkbox" id="flip-vertical" /> Flip vertical</label>
        <label><input type="checkbox" id="zoom-fill" /> Zoom to fill (crops instead of letterboxing)</label>
      </p>
      <p>
        Rotation: <span id="rotation-label">0°</span>
        <button type="button" id="rotate-left">⟲ Rotate left</button>
        <button type="button" id="rotate-right">⟳ Rotate right</button>
      </p>
    </main>
    <script type="module" src="/gui-client.js"></script>
  </body>
</html>
